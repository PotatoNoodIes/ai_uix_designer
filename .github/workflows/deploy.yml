name: Deploy UIX Agent

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The frontend build takes NO secrets. Only VITE_-prefixed vars reach the
      # bundle, and the only one is Clerk's publishable key, which is public by
      # design. Server secrets are written straight to the server below.
      - name: Install & Build
        run: |
          npm ci
          echo "VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}" > .env
          npm run build

      - name: Fail if any secret leaked into the bundle
        run: |
          if grep -rEq "AIza[A-Za-z0-9_-]{10,}" dist/; then
            echo "::error::A Google API key was found in the built bundle. Refusing to deploy."
            exit 1
          fi
          if grep -rq "${{ secrets.UPSTASH_REDIS_REST_TOKEN }}" dist/; then
            echo "::error::The Upstash token was found in the built bundle. Refusing to deploy."
            exit 1
          fi
          echo "No secrets found in dist/."

      - name: Copy Files to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/*,api,package.json,package-lock.json,ecosystem.config.cjs"
          target: "/home/jose/uix-agent"
          overwrite: true

      # Server-side secrets live only on the server, read at runtime by the Bun
      # API process. They are never present at build time.
      - name: Write server environment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            umask 077
            cat > /home/jose/uix-agent/.env <<'ENVEOF'
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
            UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }}
            UPSTASH_REDIS_REST_TOKEN=${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
            NODE_ENV=production
            ENVEOF
            chmod 600 /home/jose/uix-agent/.env

      - name: SSH and Restart PM2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/jose/uix-agent
            npm ci --omit=dev

            # Load the env written in the previous step into this shell so pm2
            # inherits it. pm2 does not read .env on its own.
            set -a
            . ./.env
            set +a

            pm2 restart uix-agent

            # The uix-api process was originally created pointing at
            # api/demo-check.ts under the bun interpreter. That file no longer
            # exists, so a plain `pm2 restart` would resurrect a dead
            # definition. Delete and recreate from the ecosystem file instead.
            pm2 delete uix-api || true
            pm2 start ecosystem.config.cjs --only uix-api --update-env
            pm2 save

            # Fail the deploy if the API did not come up.
            sleep 3
            curl -fsS http://localhost:3001/health
