name: Deploy UIX Agent

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build
        run: |
          npm ci
          echo "VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}" > .env
          npm run build

      - name: Fail if any secret leaked into the bundle
        run: |
          if grep -rEq "AIza[A-Za-z0-9_-]{10,}" dist/; then
            echo "::error::A Google API key was found in the built bundle. Refusing to deploy."
            exit 1
          fi
          if grep -rq "${{ secrets.UPSTASH_REDIS_REST_TOKEN }}" dist/; then
            echo "::error::The Upstash token was found in the built bundle. Refusing to deploy."
            exit 1
          fi
          echo "No secrets found in dist/."

      - name: Copy Files to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/*,api,package.json,package-lock.json,ecosystem.config.cjs"
          target: "/home/jose/uix-agent"
          overwrite: true

      - name: Write server environment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            umask 077
            cat > /home/jose/uix-agent/.env <<'ENVEOF'
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
            UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }}
            UPSTASH_REDIS_REST_TOKEN=${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
            NODE_ENV=production
            ENVEOF
            chmod 600 /home/jose/uix-agent/.env

      - name: SSH and Restart PM2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/jose/uix-agent

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            NODE_MAJOR=$(node -p 'process.versions.node.split(".")[0]')
            echo "node $(node -v) / npm $(npm -v)"
            if [ "$NODE_MAJOR" -lt 20 ]; then
              echo "::error::Server node is $(node -v); @google/genai requires >= 20."
              exit 1
            fi
            export NODE_BIN="$(command -v node)"

            npm ci --omit=dev

            set -a
            . ./.env
            set +a

            pm2 restart uix-agent

            pm2 delete uix-api || true
            pm2 start ecosystem.config.cjs --only uix-api --update-env
            pm2 save

            for i in $(seq 1 15); do
              BODY=$(curl -fsS http://localhost:3001/health 2>/dev/null) && break || true
              sleep 2
            done

            if [ -z "$BODY" ]; then
              echo "::error::uix-api did not become healthy."
              curl -s -o /dev/null -w 'final status: %{http_code}\n' http://localhost:3001/health || true
              curl -s http://localhost:3001/health || true
              echo "--- pm2 logs ---"
              pm2 logs uix-api --lines 40 --nostream || true
              exit 1
            fi

            echo "healthy: $BODY"
